module:
  identifier: "transactions"
  schema: "steep_demo_fintech"
  table: "transactions"
  description: "Individual payment transactions with amount, currency, country and location."
  dimensions:
    - column: "country"
      type: "country"
      label: "Country"
      description: "The country where the transaction took place"
    - column: "currency"
      type: "categorical"
      label: "Currency"
    - column: "type"
      type: "categorical"
      label: "Transaction type"
    - column: "h3_cell_index_lvl_4"
      type: "h3-cell-index"
      label: "H3 cell (level 4)"
    - column: "h3_cell_index_lvl_8"
      type: "h3-cell-index"
      label: "H3 cell (level 8)"
  metrics:
    - identifier: "transactions"
      name: "Transactions"
      description: "Number of transactions"
      time: "transactions.created_at"
      type: "count"
      dimensions:
        - "this.*"
    - identifier: "transaction_volume"
      name: "Transaction volume"
      description: "Total transaction amount, summed across currencies"
      time: "transactions.created_at"
      type: "sum"
      value: "transactions.amount"
      dimensions:
        - "this.*"
      slices:
        - name: "EUR"
          filter:
            column: "currency"
            operator: "equals"
            expression: "eur"
        - name: "USD"
          filter:
            column: "currency"
            operator: "equals"
            expression: "usd"
    - identifier: "active_customers"
      name: "Active customers"
      description: "Number of unique customers with at least one transaction"
      time: "transactions.created_at"
      type: "count-distinct"
      distinct_on: "transactions.customer_id"
      dimensions:
        - "this.*"
    - identifier: "avg_transaction_value"
      name: "Average transaction value"
      description: "Transaction volume divided by number of transactions"
      type: "derived-ratio"
      numerator: "transaction_volume"
      denominator: "transactions"
      format: "number"
  entities:
    - identifier: "transaction"
      name: "Transaction"
      icon_name: "credit-card"
      primary_key: "id"
      properties:
        - column: "created_at"
          name: "Created at"
          type: "time"
        - column: "amount"
          name: "Amount"
          type: "number"
        - column: "currency"
          name: "Currency"
          type: "string"
        - column: "country"
          name: "Country"
          type: "string"
        - column: "type"
          name: "Type"
          type: "string"
        - column: "customer_id"
          name: "Customer ID"
          type: "string"
      metrics:
        - "transactions"
        - "transaction_volume"
